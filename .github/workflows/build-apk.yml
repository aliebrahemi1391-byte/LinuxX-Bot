name: LinuxX Bot APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Find Buildozer project
        shell: bash
        run: |
          set -e

          SPEC=$(find project -type f -name "buildozer.spec" | head -n 1)

          if [ -z "$SPEC" ]; then
            echo "buildozer.spec was not found."
            echo "The ZIP must contain a Buildozer/Kivy project."
            exit 1
          fi

          APP_DIR=$(dirname "$SPEC")

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "Build directory:"
          ls -la "$APP_DIR"

      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: ${{ env.APP_DIR }}
          buildozer_version: stable
          command: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinuxX-Bot-APK
          path: ${{ steps.buildozer.outputs.filename }}
